name: HACS Validation
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: 7f4edb932ee9cb94fed8642ac0b013c93104d0e4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
      - name: HACS Integration validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
