name: Codex native minimum flow QA
on:
  push:
    branches: [codex/storage-matrix-7f4-qa-20261127]
permissions:
  contents: read
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact candidate and native Core
        shell: bash
        run: |
          set -euo pipefail
          candidate=7f4edb932ee9cb94fed8642ac0b013c93104d0e4
          git merge-base --is-ancestor "$candidate" HEAD
          mkdir -p "$RUNNER_TEMP/ha-qa"
          git archive "$candidate" custom_components/ha_storage_monitor | tar -x -C "$RUNNER_TEMP/ha-qa"
          printf 'default_config:\n' > "$RUNNER_TEMP/ha-qa/configuration.yaml"
          image=ghcr.io/home-assistant/home-assistant@sha256:06fd29a1fbf69ed2ea8782860645d1634dbdba02b1c1b7c120ababd7a3795392
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}} {{index .Config.Labels "io.hass.version"}}')" = 'linux/amd64 2025.2.0'
          docker run -d --name codex-min-flow --network bridge -p 127.0.0.1:18123:8123 -v "$RUNNER_TEMP/ha-qa:/config" "$image"
      - name: Onboard synthetic user and run native config flow
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs codex-min-flow 2>&1 | tail -100; docker stop codex-min-flow >/dev/null' EXIT
          python3 - <<'PYCODE'
          import json,time,urllib.request,urllib.error,urllib.parse
          base='http://127.0.0.1:18123'
          def request(path, payload=None, token=None, form=False):
              data=(urllib.parse.urlencode(payload).encode() if form else json.dumps(payload).encode()) if payload is not None else None
              headers={'Content-Type':'application/x-www-form-urlencoded' if form else 'application/json'}
              if token: headers['Authorization']='Bearer '+token
              req=urllib.request.Request(base+path,data=data,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{path}: HTTP {e.code}: {e.read().decode()[:1000]}') from None
          for _ in range(150):
              try:
                  steps=request('/api/onboarding')
                  break
              except (OSError,RuntimeError): time.sleep(2)
          else: raise RuntimeError('HA onboarding unavailable')
          print('Onboarding ready', [x['step'] for x in steps])
          client='http://localhost:8123/'
          user=request('/api/onboarding/users',{'client_id':client,'name':'QA Synthetic','username':'qa_synthetic','password':'QA-synthetic-2026!','language':'en'})
          auth=request('/auth/token',{'grant_type':'authorization_code','code':user['auth_code'],'client_id':client},form=True)
          token=auth['access_token']
          request('/api/onboarding/core_config',{},token)
          flow=request('/api/config/config_entries/flow',{'handler':'ha_storage_monitor'},token)
          print('Initial flow type:',flow.get('type'),'step:',flow.get('step_id'))
          if flow.get('type')=='form':
              if 'ha_storage_monitor'!='ha_storage_monitor': raise RuntimeError('Unexpected device form')
              fields=flow.get('data_schema',[])
              field=next(x for x in fields if x.get('name')=='mountpoints')
              options=field.get('selector',{}).get('select',{}).get('options',[])
              if not options: raise RuntimeError('No enumerated storage sources')
              mount=next((x for x in options if x=='/config' or (isinstance(x,dict) and x.get('value')=='/config')),options[0])
              if isinstance(mount,dict): mount=mount['value']
              print('Using enumerated synthetic container source:',mount)
              flow=request('/api/config/config_entries/flow/'+flow['flow_id'],{'mountpoints':[mount],'show_panel':True,'native_forecast':False},token)
          print('Final flow type:',flow.get('type'),'reason:',flow.get('reason'))
          if flow.get('type')!='create_entry': raise RuntimeError('Config flow did not create entry: '+json.dumps(flow))
          for _ in range(60):
              entries=request('/api/config/config_entries/entry',token=token)
              matched=[x for x in entries if x.get('domain')=='ha_storage_monitor']
              if len(matched)==1 and matched[0].get('state')=='loaded': break
              time.sleep(1)
          else: raise RuntimeError('Entry did not load: '+json.dumps(matched))
          print('Entry state:',matched[0]['state'])
          PYCODE
          curl -fsS http://127.0.0.1:18123/ha-storage-monitor-assets/ha-storage-monitor.js -o "$RUNNER_TEMP/served-card.js"
          cmp "$RUNNER_TEMP/ha-qa/custom_components/ha_storage_monitor/www/ha-storage-monitor.js" "$RUNNER_TEMP/served-card.js"
          sha256sum "$RUNNER_TEMP/served-card.js"
          git show "7f4edb932ee9cb94fed8642ac0b013c93104d0e4:custom_components/ha_storage_monitor/manifest.json" > "$RUNNER_TEMP/ref-manifest.json"
          cmp "$RUNNER_TEMP/ref-manifest.json" "$RUNNER_TEMP/ha-qa/custom_components/ha_storage_monitor/manifest.json"
          echo 'PASS: actual synthetic user onboarding, native config flow, loaded entry and HTTP bundle'
